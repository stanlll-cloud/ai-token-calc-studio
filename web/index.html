<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Token 成本估算工作台 · AI Token Cost Studio</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #131b33;
      --panel-2: #192342;
      --border: #28365e;
      --text: #e8eefc;
      --muted: #93a4cc;
      --accent: #4f8cff;
      --good: #22c55e;
      --warn: #f59e0b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at top right, #16244a 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      padding: 28px 20px 48px;
    }
    .wrap { max-width: 1120px; margin: 0 auto; }
    header {
      display: flex; justify-content: space-between; align-items: flex-end;
      flex-wrap: wrap; gap: 14px; margin-bottom: 22px;
    }
    h1 { margin: 0; font-size: 26px; letter-spacing: -0.02em; }
    .sub { color: var(--muted); font-size: 14px; margin-top: 6px; }
    .badge {
      background: rgba(79,140,255,0.14); color: #8cb7ff;
      border: 1px solid rgba(79,140,255,0.35); border-radius: 999px;
      padding: 6px 12px; font-size: 12px; font-weight: 600;
    }
    .grid { display: grid; grid-template-columns: 1fr 1.25fr; gap: 18px; }
    @media (max-width: 880px) { .grid { grid-template-columns: 1fr; } }
    .card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 14px; padding: 18px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.28);
    }
    .card h2 { margin: 0 0 12px; font-size: 16px; }
    textarea {
      width: 100%; min-height: 170px; resize: vertical;
      background: var(--panel-2); color: var(--text);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 12px; font-size: 13px; line-height: 1.55;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .metrics {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
      margin-top: 12px;
    }
    .metric {
      background: var(--panel-2); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px; text-align: center;
    }
    .metric .v { font-size: 20px; font-weight: 700; color: #fff; }
    .metric .k { font-size: 11px; color: var(--muted); margin-top: 3px; }
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
    .ctrl label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .ctrl input[type="range"], .ctrl input[type="number"] {
      width: 100%; accent-color: var(--accent);
    }
    .ctrl input[type="number"] {
      background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
      border-radius: 8px; padding: 7px 10px; font-size: 13px;
    }
    .actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    button {
      border: 0; border-radius: 9px; padding: 9px 14px; font-size: 13px;
      font-weight: 600; cursor: pointer;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-ghost { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 10px 8px; border-bottom: 1px solid var(--border); text-align: left; }
    th { color: var(--muted); font-weight: 600; font-size: 12px; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    .pill {
      display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px;
      background: rgba(34,197,94,0.14); color: #6ee7b7; border: 1px solid rgba(34,197,94,0.3);
    }
    .bar-bg { width: 100%; height: 6px; background: var(--panel-2); border-radius: 999px; margin-top: 5px; overflow: hidden; }
    .bar-fill { height: 100%; background: linear-gradient(90deg, var(--good), var(--accent)); border-radius: 999px; }
    .summary {
      display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 12px;
      background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 11px 14px;
      font-size: 13px;
    }
    .summary strong { color: #7dd3fc; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>AI Token 成本估算工作台</h1>
        <div class="sub">中英文 + 代码混合 Prompt 实时分词估算 · 8 大主流大模型月度账单对比 · 支持缓存命中率测算</div>
      </div>
      <span class="badge">Zero-Dependency Python + Web UI</span>
    </header>

    <div class="grid">
      <section class="card">
        <h2>1. 输入业务 Prompt / 上下文模板</h2>
        <textarea id="promptInput">你是一名资深架构师，请根据以下微服务日志定位根因并给出修复方案：
1. 分析连接池超时与慢 SQL 的关联；
2. 输出可落地的 Python/Go 修复代码片段；
3. 给出压测验证指标（P99 < 120ms, 错误率 < 0.1%）。</textarea>

        <div class="metrics">
          <div class="metric"><div class="v" id="mTokens">-</div><div class="k">估算输入 Token</div></div>
          <div class="metric"><div class="v" id="mChars">-</div><div class="k">总字符数</div></div>
          <div class="metric"><div class="v" id="mCjk">-</div><div class="k">中文字符</div></div>
          <div class="metric"><div class="v" id="mWords">-</div><div class="k">英文/代码词</div></div>
        </div>

        <div class="controls">
          <div class="ctrl">
            <label><span>单次输出 Token</span><strong id="vOut">600</strong></label>
            <input id="outTokens" type="number" min="50" max="32000" step="50" value="600" />
          </div>
          <div class="ctrl">
            <label><span>每日请求次数</span><strong id="vReq">500</strong></label>
            <input id="reqDay" type="number" min="1" max="1000000" step="50" value="500" />
          </div>
          <div class="ctrl">
            <label><span>Prompt 缓存命中率</span><strong id="vCache">30%</strong></label>
            <input id="cacheRate" type="range" min="0" max="95" step="5" value="30" />
          </div>
          <div class="ctrl">
            <label><span>核算周期（天）</span><strong id="vDays">30 天</strong></label>
            <input id="days" type="number" min="1" max="365" value="30" />
          </div>
        </div>

        <div class="actions">
          <button class="btn-primary" id="btnSample">加载长上下文示例</button>
          <button class="btn-ghost" id="btnExport">导出测算 JSON</button>
        </div>
      </section>

      <section class="card">
        <h2>2. 主流模型月度费用实时排行（按成本从低到高）</h2>
        <div class="summary" id="summaryBar">正在测算...</div>
        <table>
          <thead>
            <tr>
              <th>模型 / 厂商</th>
              <th class="num">输入/输出单价(元/M)</th>
              <th class="num">单次(元)</th>
              <th class="num">周期总成本(元)</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </section>
    </div>
  </div>

  <script>
    const els = {
      prompt: document.getElementById("promptInput"),
      outTokens: document.getElementById("outTokens"),
      reqDay: document.getElementById("reqDay"),
      cacheRate: document.getElementById("cacheRate"),
      days: document.getElementById("days"),
      mTokens: document.getElementById("mTokens"),
      mChars: document.getElementById("mChars"),
      mCjk: document.getElementById("mCjk"),
      mWords: document.getElementById("mWords"),
      vOut: document.getElementById("vOut"),
      vReq: document.getElementById("vReq"),
      vCache: document.getElementById("vCache"),
      vDays: document.getElementById("vDays"),
      tbody: document.getElementById("tbody"),
      summaryBar: document.getElementById("summaryBar"),
    };

    let lastPayload = null;

    async function recalculate() {
      const cachePct = Number(els.cacheRate.value);
      els.vOut.textContent = els.outTokens.value;
      els.vReq.textContent = els.reqDay.value;
      els.vCache.textContent = cachePct + "%";
      els.vDays.textContent = els.days.value + " 天";

      const resp = await fetch("/api/estimate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          prompt: els.prompt.value,
          output_tokens: Number(els.outTokens.value) || 600,
          requests_per_day: Number(els.reqDay.value) || 500,
          cache_hit_rate: cachePct / 100,
          days: Number(els.days.value) || 30,
        }),
      });
      const data = await resp.json();
      lastPayload = data;

      const tb = data.token_breakdown;
      els.mTokens.textContent = tb.total_tokens;
      els.mChars.textContent = tb.char_count;
      els.mCjk.textContent = tb.cjk_chars;
      els.mWords.textContent = tb.latin_words;

      const results = data.results || [];
      const maxCost = Math.max(...results.map(r => r.period_cny), 0.01);
      if (results.length > 0) {
        const best = results[0];
        const top = results[results.length - 1];
        els.summaryBar.innerHTML =
          `<span>最低方案：<strong>${best.name}</strong> (¥${best.period_cny.toFixed(2)})</span>` +
          `<span>最高方案：<strong>${top.name}</strong> (¥${top.period_cny.toFixed(2)})</span>` +
          `<span>总调用量：<strong>${(data.requests_per_day * data.days).toLocaleString()} 次</strong></span>`;
      }

      els.tbody.innerHTML = results.map((r, i) => {
        const pct = Math.max(4, Math.round((r.period_cny / maxCost) * 100));
        return `
          <tr>
            <td>
              <div><strong>${r.name}</strong> <span class="pill">${r.tag}</span></div>
              <div style="color:var(--muted);font-size:11px;margin-top:2px;">${r.provider} · ${r.context_k}K 上下文</div>
              <div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div>
            </td>
            <td class="num">¥${r.input_cny_1m} / ¥${r.output_cny_1m}</td>
            <td class="num">¥${r.per_call_cny.toFixed(5)}</td>
            <td class="num"><strong>¥${r.period_cny.toFixed(2)}</strong><div style="color:var(--muted);font-size:11px;">≈ $${r.period_usd.toFixed(2)}</div></td>
          </tr>`;
      }).join("");
    }

    document.getElementById("btnSample").addEventListener("click", () => {
      els.prompt.value = (
        "请作为企业级研发效能分析助手，阅读以下多模块变更摘要：\n" +
        "def calculate_costs(input_tokens, output_tokens, requests_per_day, cache_hit_rate=0.3):\n" +
        "    return {'status': 'ok', 'p99_ms': 42}\n"
      ).repeat(8);
      recalculate();
    });

    document.getElementById("btnExport").addEventListener("click", () => {
      if (!lastPayload) return;
      const blob = new Blob([JSON.stringify(lastPayload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "token-cost-report.json";
      a.click();
      URL.revokeObjectURL(url);
    });

    [els.prompt, els.outTokens, els.reqDay, els.cacheRate, els.days].forEach(el => {
      el.addEventListener("input", recalculate);
    });

    recalculate();
  </script>
</body>
</html>
